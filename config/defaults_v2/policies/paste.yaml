# 网页粘贴模式 · 检索关闭期。网页端 AI 没有应用侧记忆，提示词必须自包含、便于人整块复制。
mode: paste
estimator:
  strategy: hybrid
  zh_ratio: 1.0
  ascii_ratio: 0.28
  other_ratio: 0.5
  safety_margin: 1.15
context_window: 8000
max_output_tokens: 1200
modules:
  system_contract: { on: true,  budget: 1200, trim: 0 }
  persona_opening: { on: true,  budget: 600,  trim: 0 }
  state_card:      { on: true,  budget: 1200, trim: 3 }
  rolling_summary: { on: true,  budget: 1200, trim: 4 }
  lore_chunks:     { on: false, budget: 0,    top_n: 0, trim: 5 }
  recent_passages: { on: true,  budget: 2400, n: 4,    trim: 6 }
  action_choices:  { on: true,  budget: 300,  trim: 0 }
  buffer:          { on: true,  budget: 1100, trim: 0 }
retrieval: { bm25_topk: 30, vec_topk: 30, fusion: rrf, rrf_k: 60 }
throttle:  { summary_every_n: 1, state_mode: every_turn }
templates: { system: templates/system.paste.md }
output_template: templates/output.paste.md
